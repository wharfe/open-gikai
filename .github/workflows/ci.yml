name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: out/
          retention-days: 1

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pyyaml is not optional: several tests parse daily-batch.yml to fence the
      # summarize.py<->workflow contract (the exit codes, the held/abandoned
      # failure step, the notify-stuck condition). They guard themselves with
      # importorskip, so without it they SKIP here — a fail-open guard in the one
      # place the regression would land.
      # anthropic is pinned below 1.0 for the same reason daily-batch.yml
      # pins it: 1.x ships httpx2 instead of httpx, and both
      # `scripts/pipeline/summarizer.py` and the tests' own fake responses
      # import `httpx` directly. Keep this the SAME CONSTRAINT daily-batch.yml
      # uses -- a CI that tests a different SDK range than the pipeline runs is
      # worse than no pin, because it goes green on code the morning cannot
      # execute. That is enforced, not just asked for:
      # `test_the_anthropic_pin_matches_what_the_summary_layer_imports`, which
      # compares the ranges after normalising them, so reordering the clauses
      # is fine and widening them is not.
      - run: pip install 'anthropic>=0.72,<1' python-dotenv pytest pyyaml
      - run: cd scripts && python -m pytest -q

  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: out/
      - run: npx playwright test --reporter=github
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

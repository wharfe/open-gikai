name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: out/
          retention-days: 1

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pyyaml is not optional: several tests parse daily-batch.yml to fence the
      # summarize.py<->workflow contract (the exit codes, the held/abandoned
      # failure step, the notify-stuck condition). They guard themselves with
      # importorskip, so without it they SKIP here — a fail-open guard in the one
      # place the regression would land.
      # requirements-dev.txt starts with `-r requirements.txt`, so CI installs a
      # SUPERSET of what the morning run installs. That is the point, not a
      # convenience: #80 happened in the gap between two independently resolved
      # dependency sets, where neither side could ever catch what the other was
      # about to install. pyyaml is in there too — without it the
      # workflow-contract tests `importorskip` themselves into silence.
      - run: pip install -r requirements-dev.txt
      - run: cd scripts && python -m pytest -q

  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: out/
      - run: npx playwright test --reporter=github
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

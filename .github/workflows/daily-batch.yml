name: Daily Batch

on:
  schedule:
    # Run at 6:00 AM JST (21:00 UTC previous day).
    # NDL transcripts are typically published days or weeks after a session,
    # so the batch re-fetches a sliding window each run.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many past days to (re-)fetch. Default: 30"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  fetch-and-summarize:
    name: Fetch & Summarize
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Exported so notify-stuck-batch can skip the dates this run's failure path
    # already commented about (#71) instead of muting itself on every red
    # morning. Empty when the job died before Collect — correct: nothing
    # reported them either, so nothing should be suppressed.
    outputs:
      held_dates: ${{ steps.collect.outputs.held_dates }}
      abandoned_dates: ${{ steps.collect.outputs.abandoned_dates }}
    env:
      # Route untrusted input through env so it never lands in a run: string
      # as a literal expression interpolation.
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '30' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The stalled-pipeline check below counts consecutive zero-thread runs
          # in `git log -n 10`. The default shallow clone (depth 1) leaves at
          # most this run's own commits reachable, so that counter could never
          # pass 1 and its `>= 7` warning has never once fired. Enough depth to
          # see the 40-commit window it scans (data commits are interleaved with
          # chore ones, so 10 data commits need well over 10 of history).
          fetch-depth: 60

      # Must run before ANY step that commits. summarize.py early-commits the
      # pending-batch sidecar mid-poll (its safety net against the job being
      # killed with a batch in flight); with the identity set later, in the
      # commit step, that git commit exited 128 on every date and the net was
      # never actually armed in CI.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The DIRECT versions this job runs on are pinned in requirements.txt, and
      # that file's header says why — and is honest about what is still loose:
      # 20 of the 29 packages resolved on 2026-08-23 were transitive and still
      # re-resolve every run (#93). The short version: this step used to `pip install <bare
      # names>`, so each morning re-resolved the latest release of everything,
      # including the ones this repo imports directly. #80.
      #
      # Do not add a package to this line. A name here is a version nothing
      # pins, which is the whole failure.
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Validate lookback window
        # Defense-in-depth: the input is admin-only and is also routed through
        # env, but we still pin it to a small integer before any shell use.
        run: |
          case "$LOOKBACK_DAYS" in
            ''|*[!0-9]*) echo "Invalid LOOKBACK_DAYS: $LOOKBACK_DAYS"; exit 1 ;;
          esac
          if [ "$LOOKBACK_DAYS" -gt 365 ]; then
            echo "LOOKBACK_DAYS too large: $LOOKBACK_DAYS"; exit 1
          fi

      # ----- Source: NDL Diet Records -----
      - name: Fetch from NDL API (lookback window)
        run: python scripts/fetch_ndl.py --lookback-days "$LOOKBACK_DAYS"

      # ----- Source: Kantei Press Conferences -----
      - name: Fetch from Kantei (lookback window)
        continue-on-error: true
        run: python scripts/fetch_kantei.py --lookback-days "$LOOKBACK_DAYS"

      # ----- Source: Council (審議会) Meeting Minutes -----
      - name: Fetch from Council (lookback window)
        continue-on-error: true
        run: |
          for COUNCIL in kisei nichiiki kankeijinkou suishin chiikiseikatsu chihousousei digital_denen kyojushien; do
            python scripts/fetch_council.py --council "$COUNCIL" --lookback-days "$LOOKBACK_DAYS" || true
          done

      # ----- Determine which dates have raw data -----
      - name: Detect dates with raw data
        id: dates
        run: |
          DATES=$(ls data/raw/ 2>/dev/null \
            | grep -E '^(ndl|kantei|council-[a-z_]+)-[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' \
            | sed -E 's/^(ndl|kantei|council-[a-z_]+)-([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$/\2/' \
            | sort -u | tr '\n' ' ')
          echo "Found raw data for dates: $DATES"
          echo "list=$DATES" >> "$GITHUB_OUTPUT"

      # ----- Resume in-flight batches from prior runs FIRST -----
      # Collects any committed sidecars (data/pending-batches/) within a shared
      # budget. Every sidecar state (RESUBMIT/HOLD/BLOCKED/LOST) exits 0 — see
      # the comment below. Non-zero here means a crash, not a batch outcome.
      - name: Collect pending batches
        id: collect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          # No rc capture on purpose. This process speaks for MANY dates, so it
          # answers with systemic/suspect/held/abandoned_dates outputs (written
          # from Python) and exits 0 for every sidecar state — including the ones
          # that need a human. Since #65 a non-zero code from here means a crash,
          # and must still abort under set -e.
          python scripts/summarize.py --collect-pending --batch-budget 1800 --ci-commit

      # ----- Summarize (auto-resume per date) -----
      # --batch routes the per-thread summary calls through the Message
      # Batches API for a 50% input/output token discount, stackable with
      # the prompt-caching prefix. Grouping and outcome extraction remain
      # synchronous (one small call per meeting; not worth batching).
      - name: Summarize new content with Claude API
        id: summarize
        if: steps.dates.outputs.list != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATES_LIST: ${{ steps.dates.outputs.list }}
        run: |
          set -e
          # Dates that produced no usable summary. Collected rather than raised
          # here: the run must still publish what it has, so the job is failed
          # at the very end instead (see "Fail the run" below).
          #   exit 3 = systemic     — enough evidence on its own
          #   exit 4 = suspect      — one meeting failed on an already-published
          #                           date. Alone that is ordinary breakage; the
          #                           30-day lookback re-visits published dates
          #                           daily, so failing on one would fail most
          #                           mornings. Several in ONE run is different:
          #                           a total outage can present as nothing but
          #                           1-of-1 failures. This loop only collects
          #                           the per-date verdicts; the threshold lives
          #                           in the final step, which is the only place
          #                           that also sees Collect's dates.
          SYSTEMIC=""
          SUSPECT=""
          for d in $DATES_LIST; do
            # Per-date, not per-run. A sidecar means THIS date already has a batch
            # in flight (or held for a human), so re-summarizing it would submit a
            # second one. It says nothing about the other dates — gating all of
            # them on one stuck sidecar is what turned a single uncollectable
            # batch into a two-month outage (#43/#44).
            if [ -f "data/pending-batches/$d.json" ]; then
              echo "Sidecar present for $d — Collect owns this date; skipping"
              continue
            fi
            echo "::group::Summarize $d"
            # `|| rc=$?` keeps `set -e` from aborting the loop on exit 3 and 4,
            # while any OTHER non-zero code still aborts it as before — a crash
            # and an outage need different handling, and swallowing both would
            # put us back where 2026-08-05 started.
            rc=0
            python scripts/summarize.py --date "$d" --batch --batch-budget 1200 --ci-commit || rc=$?
            if [ "$rc" -eq 3 ]; then
              SYSTEMIC="$SYSTEMIC $d"
            elif [ "$rc" -eq 4 ]; then
              SUSPECT="$SUSPECT $d"
            elif [ "$rc" -ne 0 ]; then
              echo "::endgroup::"
              # Say it before dying: a crash on a LATER date must not erase the
              # fact that an earlier one hit a systemic failure. Writing to
              # GITHUB_OUTPUT here would be pointless — every step below has an
              # implicit success() and is skipped once this one fails, so both
              # the run summary and the final diagnostic step never run. An
              # annotation is the one channel that survives a failed step.
              if [ -n "$SYSTEMIC$SUSPECT" ]; then
                echo "::error::Nothing reached the site on:$SYSTEMIC$SUSPECT (before this crash)"
              fi
              exit "$rc"
            fi
            echo "::endgroup::"
            # Once a date leaves a pending sidecar, stop submitting new batches
            # so we never pile up multiple in-flight batches in one run.
            # Distinct from the per-date skip at the top: that one is cross-run
            # (Collect owns the date), this one is within-run (at most one NEW
            # in-flight batch per run).
            if [ -f "data/pending-batches/$d.json" ]; then
              echo "Batch for $d is pending — stopping further submits this run"
              break
            fi
          done
          # The threshold is NOT applied here any more: this step never sees
          # the dates Collect reported (only Collect owns those), so a policy
          # applied here would be blind to half its input. It moved to the
          # last step, which sees both.
          echo "systemic_dates=$SYSTEMIC" >> "$GITHUB_OUTPUT"
          # Always published, failing or not: one suspect date is not worth a red
          # run, but it must still be visible in the run summary. A signal nobody
          # can see is the state this whole change exists to leave behind.
          echo "suspect_dates=$SUSPECT" >> "$GITHUB_OUTPUT"

      # ----- Enrich threads with news articles (Bing News RSS) -----
      # --rank-with-claude filters Bing candidates through a Haiku 4.5 call
      # so we don't attach semantically-similar-but-unrelated articles
      # (e.g. "AI絵画展" for an "AI規制" thread). Best-effort; if the call
      # fails, the script falls back to the top Bing results.
      - name: Enrich threads with news
        if: steps.dates.outputs.list != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATES_LIST: ${{ steps.dates.outputs.list }}
        run: |
          for d in $DATES_LIST; do
            if [ -f "data/threads/$d.json" ]; then
              echo "::group::Enrich $d"
              python scripts/enrich-news.py --date "$d" --rank-with-claude || true
              echo "::endgroup::"
            fi
          done

      # ----- Post-processing -----
      - name: Validate data
        run: node scripts/validate-data.mjs --fix

      # After the validator, never before it: --fix adds members that appear
      # only in threads, with no links and no `id`. Enriching first commits
      # those with zero links on the same morning. No `|| true` — the enricher
      # going quiet for months, with nobody noticing, is what this replaces.
      - name: Enrich member links
        id: enrich_members
        run: node scripts/enrich-members.mjs

      - name: Generate feeds and sitemaps
        run: |
          node scripts/generate-feeds.js
          node scripts/generate-sitemap.mjs

      # ----- Compute "new threads added" metrics for monitoring -----
      - name: Compute new-thread metrics
        id: metrics
        env:
          DATES_LIST: ${{ steps.dates.outputs.list }}
        run: |
          TOTAL_NEW=0
          NEW_DATES=""
          for d in $DATES_LIST; do
            FILE="data/threads/$d.json"
            [ -f "$FILE" ] || continue
            # `|| echo 0` is not cosmetic, and the asymmetry with BEFORE below
            # was the bug: this step runs under `bash -e`, so an assignment
            # whose command substitution fails FAILS THE STEP — and the very
            # next step is the commit. A single corrupt data/threads/*.json
            # therefore skipped the whole morning's publish, which is exactly
            # what summarize.py's exit 3 exists to prevent (#74). Counting it
            # as 0 is also the honest answer: a file we cannot read published
            # no new threads.
            COUNT=$(python3 -c "import json; print(len(json.load(open('$FILE'))))" \
              2>/dev/null || echo 0)
            BEFORE=$(git show HEAD:"$FILE" 2>/dev/null \
              | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null \
              || echo 0)
            DELTA=$((COUNT - BEFORE))
            if [ "$DELTA" -gt 0 ]; then
              TOTAL_NEW=$((TOTAL_NEW + DELTA))
              NEW_DATES="$NEW_DATES $d(+$DELTA)"
            fi
          done
          echo "new_threads=$TOTAL_NEW" >> "$GITHUB_OUTPUT"
          echo "new_dates=$NEW_DATES" >> "$GITHUB_OUTPUT"
          echo "Total new threads this run: $TOTAL_NEW"

      - name: Commit and push data
        id: commit
        env:
          NEW_THREADS: ${{ steps.metrics.outputs.new_threads }}
        run: |
          # Identity is configured once at the top of the job (see above).
          # public/sitemap*.xml covers sitemap.xml, sitemap-*.xml and sitemap_index.xml
          # — all variants emitted by generate-sitemap.mjs.
          mkdir -p data/pending-batches
          # #57's option (b) / #75. The atomic writer stops this pipeline from
          # CREATING a corrupt data file; this keeps one that arrived another way
          # out of the commit. src/lib/data.ts is deliberately fatal on a corrupt
          # file, so a single one committed here kills the next production build
          # — days later, with nothing pointing back at this run.
          #
          # Read the verdict before believing the exclusion: keeping a file out
          # of the commit only RESCUES anything when the committed copy is
          # readable (`head_ok`). For the causes #75 names — a hand edit, a bad
          # merge — the corrupt file is already in HEAD when CI checks out, so
          # excluding it leaves that same corrupt blob committed and the
          # production build broken (`head_broken`). The checker reports which
          # case each file is and the wording below follows it, because "the site
          # stays up" is false in that one.
          #
          # The checker exits 0 by design, even having found something: failing
          # this step publishes NOTHING, which is the amplification #52/#65/#72
          # keep removing. Until #74 the metrics step did exactly that by
          # accident.
          #
          # So a non-zero exit here means the CHECKER broke, not that the data
          # did — an import error, a `data/` path that is a directory. `|| true`
          # would swallow exactly that and stage everything under a green run
          # with no annotation: the guard would vanish on the one morning it was
          # the thing that mattered. Kept publishing (that rule does not bend),
          # but said out loud and carried to the last step so the run goes red.
          if BROKEN=$(python scripts/check_committable_json.py); then
            :
          else
            CHECK_RC=$?
            echo "::error::The committable-JSON check itself failed (exit ${CHECK_RC}) — NOTHING was excluded from this commit and no data file was inspected. If a corrupt one was committed, the next production build dies. This step's log has the traceback."
            BROKEN=""
            echo "broken_json_check_failed=true" >> "$GITHUB_OUTPUT"
          fi
          # Excluded from the `git add` itself, NOT unstaged afterwards. That is
          # not a style choice: one of the reasons the checker reports a file is
          # that it could not be OPENED (permissions, an I/O error), and
          # `git add` on a directory containing one of those exits 128 having
          # staged NOTHING — not even its healthy siblings — so under `bash -e`
          # the add-then-reset order turns "one path is stale" into "nothing
          # publishes" for exactly the input this check exists to survive.
          # Verified: `error: unable to index file` / `fatal: adding files
          # failed`, empty index.
          ADD_EXCLUDES=()
          if [ -n "$BROKEN" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] && ADD_EXCLUDES+=(":(exclude)$f")
            done <<< "$(echo "$BROKEN" | cut -f1)"
          fi
          git add data/threads/ data/pending-batches/ data/members.json data/status.json \
            public/sitemap.xml public/sitemap-*.xml public/sitemap_index.xml \
            public/feed.xml "${ADD_EXCLUDES[@]}"
          if [ -n "$BROKEN" ]; then
            echo "::error::Excluded from the commit — these data files could not be read, so committing them would break the production build:"
            echo "$BROKEN" | while IFS=$'\t' read -r f verdict why; do
              echo "::error::  $f [$verdict] — $why"
            done
            echo "Every OTHER file was committed as usual. What the verdict means:"
            echo "  head_ok      — the repository's version is readable and is what"
            echo "                 stays committed. The site is stale for that path"
            echo "                 and nothing else; \`git checkout HEAD -- <file>\`"
            echo "                 restores the working copy too."
            echo "  head_broken  — the repository ALREADY holds an unreadable version,"
            echo "                 so unstaging rescued nothing and the production"
            echo "                 build keeps failing until a human commits a fix."
            echo "                 Do NOT run \`git checkout HEAD -- <file>\`: it"
            echo "                 restores the corruption."
            echo "  not_in_head  — the file is new, so it simply does not reach the"
            echo "                 site. That path is absent, not stale."
            echo "  head_unknown — the committed copy could not be inspected. Assume"
            echo "                 nothing; check it by hand."
            echo "Note two things the exclusion does not cover, whatever the verdict:"
            echo "data/status.json was regenerated by gen_status.py, which bare-reads"
            echo "every thread file and dies on a corrupt one, so it is stale for the"
            echo "WHOLE run; and the sitemap and feed were generated without the"
            echo "excluded path's URLs (those pages stay served, just unlisted)."
            echo "broken_json=$(echo "$BROKEN" | cut -f1 | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            DATE_TAG=$(date -u +%Y-%m-%d)
            git commit -m "data: daily-batch run ${DATE_TAG} (+${NEW_THREADS} threads)"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
          # Push on "branch is ahead", NOT on "we just committed". summarize.py
          # early-commits the pending-batch sidecar and pushes it itself; when
          # that push loses a race the commit is left local, and gating the push
          # on a staged diff would discard it with the runner — orphaning a
          # batch that is already submitted and paid for, which is the exact
          # outcome the sidecar exists to prevent.
          # origin/<branch> rather than @{u}: actions/checkout's `-B` does not
          # reliably leave an upstream configured. Capture into a variable and
          # fail loudly if the ref cannot be resolved — inlining this in `if`
          # would make the count empty, `[ "" -gt 0 ]` return 2, the condition
          # read as false (conditions are exempt from `bash -e`), and the day's
          # commit die with the runner while the step reported success.
          if ! AHEAD=$(git rev-list --count "origin/${GITHUB_REF_NAME}..HEAD"); then
            echo "::error::cannot resolve origin/${GITHUB_REF_NAME} — refusing to skip the push"
            exit 1
          fi
          if [ "$AHEAD" -gt 0 ]; then
            # Push through a rebase-and-retry, not once. `AHEAD` is measured
            # against the `origin/<branch>` THIS checkout fetched, so it stays
            # true while the remote moves on: any other push during the run — a
            # human, a second dispatch that was waiting on the concurrency
            # group — makes this push non-fast-forward, and under `bash -e` the
            # step then dies with the day's commit still only local. Not
            # hypothetical: on 2026-08-23 a hand push during a recovery run cost
            # 236 assembled threads their commit (#82). Note the asymmetry it
            # fixes — summarize.py's early sidecar push already treats losing
            # this race as a warning and leans on this step; this step was the
            # one place that treated it as fatal.
            #
            # Rebase, never merge or force. What this run wrote is its own
            # generated output, so replaying it on top of whatever landed is
            # exactly right, while `--force-with-lease` would delete the other
            # push. `--autostash` because the commit stages specific pathspecs
            # and #75 deliberately leaves an unreadable file unstaged — a dirty
            # tracked file would otherwise make the rebase refuse to start.
            #
            # A rebase that stops part-way is left aborted and the step fails
            # loudly: it means something hand-edited the same generated file,
            # which is a human decision and not a retry. Everything else that
            # goes wrong short of that is retried.
            #
            # Two shape rules, both load-bearing, both learned by getting them
            # wrong once. (1) The rebase comes FIRST in the loop body and the
            # push LAST. The first version pushed first and rebased after, so
            # the third rejection bought a rebase nothing ever pushed: the
            # branch ended up correctly replayed onto origin — one `git push`
            # from published — and the step exited 1 and threw it away. (2)
            # Every iteration reaches the push. No `continue` above it, however
            # pointless the push looks after a failed fetch: the budget is
            # counted in PUSHES, and any path that skips one silently converts
            # three retries into fewer, which is the same lost day by a quieter
            # route. `attempt` 0 is the plain push; 1..3 each rebase and push.
            PUSHED=no
            for attempt in 0 1 2 3; do
              if [ "$attempt" -gt 0 ]; then
                echo "::warning::push rejected — rebasing onto origin/${GITHUB_REF_NAME} and retrying (${attempt}/3)"
                if git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
                  # `git pull --rebase --autostash` exits 0 even when RE-APPLYING
                  # the autostash conflicts: git finishes the rebase, reports
                  # "Applying autostash resulted in conflicts", keeps the stash
                  # and leaves an UNMERGED INDEX (verified on git 2.49). What
                  # conflicted is #75's deliberately-unstaged junk meeting the
                  # other push — not this run's commit, which replayed fine and
                  # is pushable.
                  #
                  # Clear it rather than carrying it, because an unmerged index
                  # makes every LATER `git pull` refuse outright ("Pulling is
                  # not possible because you have unmerged files", exit 128,
                  # with no rebase started). That reaches this loop as a
                  # not-a-conflict failure, so the loop would spend its whole
                  # budget on a state that cannot resolve itself and then throw
                  # away a commit it was one push from publishing. `reset --hard
                  # HEAD` drops only the failed re-apply: HEAD is the replayed
                  # commit, everything dirty is already IN the stash, and the
                  # stash survives. `git ls-files -u` rather than `git stash
                  # list` — the question is whether THIS re-apply conflicted,
                  # and a pre-existing stash is not evidence of that.
                  # Captured separately rather than inlined in `[ -n ... ]`:
                  # there the exit status disappears into the test's result, so
                  # an index git cannot even read would answer "nothing
                  # conflicted" and walk straight into the state above.
                  if ! UNMERGED=$(git ls-files -u); then
                    echo "::error::cannot read the index after rebasing onto origin/${GITHUB_REF_NAME} — see the git output above. This run's data commit is LOCAL and dies with the runner."
                    exit 1
                  fi
                  if [ -n "$UNMERGED" ]; then
                    echo "::warning::the rebase finished but left an unmerged index — almost certainly the autostash failing to re-apply over the other push (see the git output above); discarding it. This run's commit is unaffected and is being pushed."
                    # Guarded for the same reason as the `git rev-parse` below:
                    # a bare failure here is `bash -e` killing the step without
                    # ever saying the day is gone.
                    if ! git reset -q --hard HEAD; then
                      echo "::error::could not clear the unmerged autostash re-apply — see the git output above. This run's data commit is LOCAL and dies with the runner."
                      exit 1
                    fi
                  fi
                else
                  # Only a rebase left IN PROGRESS says the replay itself
                  # stopped. Everything else that fails here — a fetch that
                  # timed out, expired credentials, a ref that would not
                  # resolve, the unmerged index above — never started one, so
                  # `git rebase --abort` fails and `|| true` hides it. Telling
                  # those apart is not cosmetic: announcing a conflict sends the
                  # operator hunting a hand edit that does not exist, the same
                  # morning-wasting misreport the exit-3 contract is written to
                  # avoid.
                  if ! GIT_DIR_PATH=$(git rev-parse --git-dir); then
                    # Not `bash -e`'s to swallow: a bare assignment that fails
                    # would kill the step before it said why the day is gone.
                    echo "::error::cannot inspect the git state after a failed rebase onto origin/${GITHUB_REF_NAME} — see the git output above. This run's data commit is LOCAL and dies with the runner."
                    exit 1
                  fi
                  if [ -d "${GIT_DIR_PATH}/rebase-merge" ] || [ -d "${GIT_DIR_PATH}/rebase-apply" ]; then
                    git rebase --abort || true
                    echo "::error::the rebase of this run's data commit onto origin/${GITHUB_REF_NAME} stopped part-way and an abort was issued (the git output above says whether the abort itself succeeded) — most likely a conflict with a push that landed during the run, i.e. something hand-edited the same generated file (see the git output above for what git actually said). The commit is still LOCAL and dies with the runner — nothing this run produced reached the site. Resolve by hand."
                    exit 1
                  fi
                  # No `continue`. The budget below is counted in PUSHES, and
                  # skipping one is how a rescued commit gets dropped: the push
                  # costs nothing when it cannot work, and the next attempt
                  # rebases again if the fetch recovers.
                  echo "::warning::could not rebase onto origin/${GITHUB_REF_NAME}, and NO rebase was started — this is not a content conflict (network, credentials or ref resolution; see the git output above). Pushing anyway; the remaining attempts still apply."
                fi
              fi
              # Explicit refspec, matching the rebase above, rather than a bare
              # `git push`: the comment further up already doubts that
              # actions/checkout's `-B` leaves an upstream configured, and a
              # missing upstream would otherwise spend all three retries and
              # then be reported as a lost race.
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                PUSHED=yes
                break
              fi
            done
            if [ "$PUSHED" != yes ]; then
              # Do not name a cause here. Continuous pushes, branch protection
              # and expired credentials all arrive as the same rejection, and
              # asserting one of them picks the operator's search for them.
              echo "::error::still could not push to ${GITHUB_REF_NAME} after 4 attempts, the last three each preceded by a rebase attempt — see the git output above for why each push was refused (continuous pushes, branch protection and lost credentials all look like this). This run's data commit is LOCAL and dies with the runner."
              exit 1
            fi
          else
            echo "Nothing to push"
          fi

      - name: Notify IndexNow
        if: steps.metrics.outputs.new_threads != '0'
        continue-on-error: true
        env:
          DATES_LIST: ${{ steps.dates.outputs.list }}
        run: |
          for d in $DATES_LIST; do
            if [ -f "data/threads/$d.json" ]; then
              node scripts/notify-indexnow.mjs --date "$d" || true
            fi
          done

      # ----- Surface "stalled pipeline" alerts in the workflow summary -----
      # Several consecutive zero-thread runs likely indicate a real pipeline
      # failure (NDL schema change, auth issue), not just a quiet Diet week.
      - name: Detect stalled pipeline
        id: stall
        run: |
          # Only this workflow's data commits count as "runs". summarize.py also
          # commits `chore(pipeline): persist pending batch <date>` mid-poll, and
          # that commit appears precisely when a batch is stuck — i.e. in the
          # regime this check exists to catch. Left in the stream, one such
          # commit breaks the loop on its first iteration and pins STALLED at 0.
          #
          # Filtered with `grep` on `%s`, NOT with `git log --grep`: --grep
          # matches anywhere in the commit message, so a commit merely quoting
          # "data: daily-batch run" in its body would be selected and its
          # unrelated subject printed. `tformat` (not `format`) terminates the
          # last line, which `while read` would otherwise drop — that alone cost
          # this counter one run of every window.
          STALLED=0
          while read -r line; do
            if echo "$line" | grep -q '(+0 threads)'; then
              STALLED=$((STALLED + 1))
            else
              break
            fi
          done < <(git log -n 40 --pretty=tformat:"%s" \
                     | grep '^data: daily-batch run ' | head -n 10)
          echo "consecutive_zero_runs=$STALLED" >> "$GITHUB_OUTPUT"
          if [ "$STALLED" -ge 7 ]; then
            echo "::warning::Pipeline has produced 0 new threads for $STALLED consecutive runs — investigate fetchers"
          fi

      - name: Summary
        env:
          DATES_LIST: ${{ steps.dates.outputs.list }}
          NEW_THREADS: ${{ steps.metrics.outputs.new_threads }}
          NEW_DATES: ${{ steps.metrics.outputs.new_dates }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          STALLED: ${{ steps.stall.outputs.consecutive_zero_runs }}
          SYSTEMIC_DATES: ${{ steps.summarize.outputs.systemic_dates }}
          SUSPECT_DATES: ${{ steps.summarize.outputs.suspect_dates }}
          COLLECT_SYSTEMIC_DATES: ${{ steps.collect.outputs.systemic_dates }}
          COLLECT_SUSPECT_DATES: ${{ steps.collect.outputs.suspect_dates }}
          HELD_DATES: ${{ steps.collect.outputs.held_dates }}
          ABANDONED_DATES: ${{ steps.collect.outputs.abandoned_dates }}
        run: |
          {
            echo "## Daily Batch Summary"
            echo "- **Lookback window**: ${LOOKBACK_DAYS} days"
            echo "- **Dates with raw data**: ${DATES_LIST:-(none)}"
            echo "- **New threads this run**: ${NEW_THREADS}"
            if [ -n "${NEW_DATES}" ]; then
              echo "- **Per-date breakdown**:${NEW_DATES}"
            fi
            echo "- **Committed**: ${COMMITTED}"
            echo "- **Consecutive zero-thread runs**: ${STALLED}"
            # Normalised the same way the final step does: SYSTEMIC_DATES carries
            # a LEADING space per entry (Summarize's `SYSTEMIC="$SYSTEMIC $d"`)
            # and COLLECT_SYSTEMIC_DATES carries none — concatenating the raw
            # strings fuses the last date of one list with the first of the
            # other into a single bogus token. Route both through the same
            # split/dedupe/rejoin so this text can never disagree with the
            # final step's failure text.
            SYSTEMIC_ALL=$(echo "$SYSTEMIC_DATES $COLLECT_SYSTEMIC_DATES" | tr ' ' '\n' \
                             | grep -v '^$' | sort -u | tr '\n' ' ')
            SUSPECT_ALL=$(echo "$SUSPECT_DATES $COLLECT_SUSPECT_DATES" | tr ' ' '\n' \
                            | grep -v '^$' | sort -u | tr '\n' ' ')
            if [ -n "${SYSTEMIC_ALL}" ]; then
              echo "- **Nothing reached the site on**: ${SYSTEMIC_ALL}"
            fi
            if [ -n "${SUSPECT_ALL}" ]; then
              echo "- **One meeting failed on an already-published date**: ${SUSPECT_ALL}"
              echo "  (not a failure on its own — watch for several of these in one run)"
            fi
            HELD_ALL=$(echo "$HELD_DATES" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
            ABANDONED_ALL=$(echo "$ABANDONED_DATES" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
            if [ -n "${HELD_ALL}" ]; then
              echo "- **held for a human decision**: ${HELD_ALL}"
            fi
            if [ -n "${ABANDONED_ALL}" ]; then
              echo "- **Permanently lost**: ${ABANDONED_ALL}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # LAST step on purpose. Everything above has already run: the day's
      # threads are written, committed and pushed, and IndexNow has been
      # notified. Failing here turns an outage into a red run (and, via the
      # notify-on-failure job, a GitHub issue) WITHOUT blocking the publish —
      # the amplification #52 was about. Placing it any earlier would skip the
      # steps below it.
      - name: Fail the run on a systemic summary failure
        env:
          # Through env, not inline expressions, per the same rule as
          # LOOKBACK_DAYS above. Six inputs, not two: Summarize now only skips
          # the specific dates a sidecar already owns, so both it and Collect
          # can have something to say about the same run (#59, #65) — read
          # all four kinds of output from both.
          SUMMARIZE_SYSTEMIC: ${{ steps.summarize.outputs.systemic_dates }}
          SUMMARIZE_SUSPECT: ${{ steps.summarize.outputs.suspect_dates }}
          COLLECT_SYSTEMIC: ${{ steps.collect.outputs.systemic_dates }}
          COLLECT_SUSPECT: ${{ steps.collect.outputs.suspect_dates }}
          COLLECT_HELD: ${{ steps.collect.outputs.held_dates }}
          COLLECT_ABANDONED: ${{ steps.collect.outputs.abandoned_dates }}
          # Not a date list and not a summary verdict: files the commit step
          # refused to stage (#75). Kept separate because the threshold below
          # counts dates, and this is neither weak evidence nor about one date.
          BROKEN_JSON: ${{ steps.commit.outputs.broken_json }}
          # Set when the checker itself died, i.e. when the line above is empty
          # for a reason that is NOT "nothing was broken". Reds the run for the
          # same reason a silent fail-open is worse than a loud one.
          BROKEN_JSON_CHECK_FAILED: ${{ steps.commit.outputs.broken_json_check_failed }}
        run: |
          # Deduplicate: the threshold below counts DATES, and the same date
          # arriving from both paths must not cross it on its own.
          SYSTEMIC=$(echo "$SUMMARIZE_SYSTEMIC $COLLECT_SYSTEMIC" | tr ' ' '\n' \
                       | grep -v '^$' | sort -u | tr '\n' ' ')
          SUSPECT=$(echo "$SUMMARIZE_SUSPECT $COLLECT_SUSPECT" | tr ' ' '\n' \
                      | grep -v '^$' | sort -u | tr '\n' ' ')
          SUSPECT_N=$(echo "$SUSPECT" | wc -w)

          # THE policy, in one findable place. A suspect date is one meeting
          # failing on an already-published date: the 30-day lookback re-visits
          # published dates every morning, so failing on one would fail most
          # mornings and the alarm would get switched off. Several in ONE run is
          # different — a total outage can present as nothing but 1-of-1
          # failures. Change the threshold HERE, not in Python.
          FAIL_DATES="$SYSTEMIC"
          if [ "$SUSPECT_N" -ge 2 ]; then
            FAIL_DATES="$FAIL_DATES$SUSPECT"
          fi

          # Neither of these is graded. A held sidecar is a request for a
          # decision and an abandoned one is a permanent loss; a threshold that
          # softens either would be answering a question nobody asked. They also
          # get their OWN lines: "Nothing reached the site" is a claim about
          # today's work, and neither of these is that.
          HELD=$(echo "$COLLECT_HELD" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
          ABANDONED=$(echo "$COLLECT_ABANDONED" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')

          if [ -z "$(echo "$FAIL_DATES$HELD$ABANDONED$BROKEN_JSON$BROKEN_JSON_CHECK_FAILED" | tr -d ' ')" ]; then
            echo "No systemic summary failure this run."
            exit 0
          fi

          if [ -n "$(echo "$BROKEN_JSON_CHECK_FAILED" | tr -d ' ')" ]; then
            echo "::error::The corrupt-data-file check did not run to completion."
            echo "This run committed whatever was on disk WITHOUT inspecting it, so"
            echo "the guarantee that a corrupt data file stays out of the commit did"
            echo "not hold today. Nothing here says one was committed — only that"
            echo "nobody checked. The commit step's log has the traceback."
          fi

          if [ -n "$(echo "$BROKEN_JSON" | tr -d ' ')" ]; then
            echo "::error::Left out of the commit because they could not be read:${BROKEN_JSON}"
            echo "The commit step named each one, why, and — the part that decides what"
            echo "to do — whether the repository's own copy is readable. Read that"
            echo "before assuming the site is fine: a head_broken file means the"
            echo "production build is already failing and unstaging rescued nothing."
            echo "Unconditional, like held and abandoned: a data file this pipeline"
            echo "cannot read is not weak evidence about one date, and src/lib/data.ts"
            echo "is fatal on one. Everything else published normally."
          fi

          if [ -n "$(echo "$ABANDONED" | tr -d ' ')" ]; then
            echo "::error::Permanently lost uncollected threads on:${ABANDONED}"
            echo "Those BATCHES can never be assembled: their raw is off disk and the"
            echo "results expired. Nothing recovers those results — this is on the record,"
            echo "not a request for action. Two things it does NOT mean: those dates are"
            echo "not necessarily empty (threads published by earlier runs are unaffected),"
            echo "and the dates themselves can still be re-summarized from scratch by a"
            echo "manual run with a wide enough lookback_days, at the cost of a new batch."
          fi

          if [ -n "$(echo "$HELD" | tr -d ' ')" ]; then
            echo "::error::Pending batches held for a human decision on:${HELD}"
            echo "This aggregates several regimes (hash_mismatch/BLOCKED, retry_exhausted/"
            echo "BLOCKED, and the HOLDs: raw_missing, raw_date_missing, raw_unreadable,"
            echo "threads_file_unreadable, speech_gap) that do NOT all mean the same"
            echo "thing — do not assume any one of them here. The"
            echo "Collect step annotation for EACH date names its actual reason and"
            echo "choices; read that before acting. Publishing continued for every other"
            echo "date; these sidecars stay until someone decides."
          fi

          if [ -n "$(echo "$FAIL_DATES" | tr -d ' ')" ]; then
            echo "::error::Nothing this run produced reached the site on: ${FAIL_DATES}"
            echo "This is an alert, not a publish failure — data already committed above is"
            echo "intact, and these dates may still hold threads from earlier runs."
            echo "The Summarize and Collect step annotations name which of these happened"
            echo "(they are not exclusive — a fully rejected batch reports both):"
            echo "  * 'produced no usable summary' — every meeting asked about this run came"
            echo "    back with nothing usable. That covers an API rejection (400/429/529) but"
            echo "    also an unparsable or empty response and a synchronous exception; check"
            echo "    this run's step log for the per-meeting error to see which it was."
            echo "  * 'sent no summary request at all' — a follow-on line to the one above,"
            echo "    naming meetings that are procedural with a 附帯決議: their only request"
            echo "    is the outcome one, so no thread was ever possible for them and there is"
            echo "    no summary failure to look for. Do not hunt the summary phase for these."
            echo "  * 'assembly failed: <reason>' — the reason names what assembly observed,"
            echo "    not why: hash_mismatch/speech_gap/raw_missing point at raw, missing_result"
            echo "    does not point anywhere on its own — it also fires when every request for"
            echo "    that date was rejected, in which case 'produced no usable summary' fires"
            echo "    alongside it for the same date; read both lines together."
            echo "    hash_mismatch/speech_gap/raw_missing point at raw and are NOT"
            echo "    resubmitted: they appear under 'held for a human decision' above,"
            echo "    with no retry spent. missing_result is retryable and does appear here."
          fi
          exit 1

  # ----- Publish the SAME data to the MCP server -----
  # #85. `apps/mcp` is a second Vercel project and it was deployed BY HAND, so it
  # stopped: its last deploy was 2026-05-22 and it served data ending 2026-05-19
  # while the site was at 2026-08-20. Three months, unnoticed, because the
  # endpoint answers 200 and `tools/list` works — never broken, only old.
  #
  # Deploying from here rather than wiring Vercel's git integration is
  # deliberate: the mechanism is then a reviewable line in the repo that a test
  # can read. The out-of-repo alternative can be changed or disabled invisibly,
  # which is the exact shape of the failure being fixed — and it has a trap on
  # top, since an "Ignored Build Step" scoped to `apps/mcp/**` would skip
  # data-only commits (the data lives at the repo ROOT) and rebuild this outage
  # out of configuration.
  deploy-mcp:
    name: Deploy MCP server
    needs: fetch-and-summarize
    # The credential is what enforces this, NOT the condition below. That was
    # the second finding on the same hole and it is the important one:
    # `workflow_dispatch` runs the workflow definition from the SELECTED ref, so
    # an `if:` added here only exists on the refs that already have it. Any
    # branch predating this commit still carries the old `if: !cancelled()` and
    # would deploy to production — the gate cannot gate itself.
    #
    # So `VERCEL_TOKEN` lives in the `mcp-production` environment, whose
    # deployment-branch policy allows `main` only, and NOT as a repository
    # secret. That boundary holds for workflow versions this commit will never
    # see: a job on another branch that names the environment is refused by
    # GitHub, and an old version that does not name it resolves
    # `secrets.VERCEL_TOKEN` to empty and stops at the guard below. Neither path
    # deploys. Delete the environment, or re-add the token as a repository
    # secret, and the hole is open again — the workflow file cannot tell.
    #
    # The condition is still worth having as the readable statement of intent,
    # and it is what makes a same-branch mistake fail early rather than at the
    # token check. What it is NOT is the enforcement.
    #
    # Why any of this matters: a dispatch from a feature branch would put that
    # branch's data and code on the production MCP server and go GREEN, because
    # the freshness check compares the server against the same checkout it just
    # deployed. Both sides agree; the check structurally cannot see it.
    #
    # Not `success()` for the other half: the main job fails on its LAST step for
    # a systemic-summary date, long after it has pushed. Refusing to deploy then
    # would leave the MCP server a day behind the site every time one date
    # misbehaved.
    if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    # 60, not 20, and the number is measured rather than chosen. This job's
    # first real run took 18m34s: the upload was 2 SECONDS and the build was
    # everything else, because it was queued. This Vercel account builds one at a
    # time and the frontend project — which the very same data commit triggers —
    # takes 10-11 minutes on its own (OGP images, 3400+ threads). So the MCP
    # build queues behind the site build every single morning, and 20 minutes
    # was "red the moment the site build gets a minute slower". Runner minutes
    # are free on a public repo; a timeout that fires on the normal path is not.
    #
    # 60 is headroom over ONE measurement, not a known ceiling: nothing here has
    # established how long Vercel will queue a build under load. And note what
    # this timeout does NOT do — killing the CLI does not cancel the remote
    # build, so a deploy that lands at minute 61 is reported red having actually
    # succeeded. #94 tracks asking the deployment for its state instead of
    # inferring it from our own wait.
    timeout-minutes: 60
    # No write scope. A deploy credential and `contents: write` do not belong in
    # one job, and nothing here writes to the repo.
    permissions:
      contents: read
    # Where VERCEL_TOKEN actually lives. See the comment above the `if:`.
    environment: mcp-production
    steps:
      - uses: actions/checkout@v7
        with:
          # THE tip of the branch, not `github.sha`. On a scheduled run that SHA
          # is main as it was when the run started — BEFORE the data commit this
          # job exists to publish. Checking it out would deploy yesterday's data
          # every morning while reporting success.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mcp/package-lock.json

      - name: Install MCP dependencies
        working-directory: apps/mcp
        run: npm ci

      # Must run HERE, not on Vercel. `vercel deploy` uploads `apps/mcp` alone,
      # so the repo-root `data/` is not there to copy from; the remote prebuild
      # then only verifies the bundle already inside the upload (#73). Skip this
      # and the deploy succeeds while shipping whatever was last bundled.
      - name: Bundle the current data into apps/mcp
        working-directory: apps/mcp
        run: node ./scripts/copy-data.mjs

      - name: Deploy to Vercel
        working-directory: apps/mcp
        env:
          # Identifiers, not secrets — kept literal so the wiring stays visible
          # in the repo. `.vercel/` is gitignored, so the CLI needs them here.
          VERCEL_ORG_ID: team_3NsOtiHzlY5xjLpmjw9PAOE7
          VERCEL_PROJECT_ID: prj_9keEpvlkpx71V2A1dQkH7QtcKV95
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          # Fail loudly rather than skip. A missing token means the MCP server is
          # going stale, which is the thing this job exists to stop — and a
          # warning nobody reads is how it went stale for three months. The data
          # publish already happened in the job above, so this red does not block
          # the site.
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set, so nothing was deployed and nothing was compared — what the MCP server is currently serving is UNKNOWN from here, and this says nothing either way about whether the publish job above succeeded (this job runs even when it did not). Create a Vercel token with deploy access to open-gikai-mcp, scoped to the team that owns it, and add it as the VERCEL_TOKEN repository secret (#85). To find out the server's actual state: python3 scripts/check_mcp_freshness.py --attempts 1"
            exit 1
          fi
          # Pinned for the reason requirements.txt exists: an unpinned tool that
          # re-resolves every morning changes production without a commit (#80).
          #
          # The failure is caught so the annotation can name where to look. The
          # first run of this job died on `Error: Project not found` with BOTH
          # ids echoed back — and they are the right ids, byte-for-byte what
          # `apps/mcp/.vercel/project.json` holds. A reader who trusts the CLI's
          # wording goes hunting for a deleted project that exists. The
          # hypotheses below are hypotheses; this step does not know which, and
          # says so rather than picking one (an operator sent to the wrong place
          # is the cost this pipeline keeps measuring).
          if ! npx --yes vercel@59.3.0 deploy --prod --yes --token "$VERCEL_TOKEN"; then
            echo "::error::vercel deploy exited non-zero, so what the MCP server is now serving is UNCONFIRMED — most likely the previous bundle, though a deploy can also complete and then lose the connection (#85). The freshness step below does not run after this, so nothing here has compared it. If the CLI said 'Project not found', do not take that literally: VERCEL_PROJECT_ID/VERCEL_ORG_ID above are set from apps/mcp/.vercel/project.json, so check instead (a) that the VERCEL_TOKEN secret belongs to an account with access to the TEAM that owns open-gikai-mcp — a personal-scope token cannot see a team project and reports it as missing, and (b) that the ids still name a live project — read them off the Vercel dashboard for open-gikai-mcp, NOT off apps/mcp/.vercel/project.json, which is gitignored and exists only on whichever machine last ran vercel link. Verify the current state with: python3 scripts/check_mcp_freshness.py --attempts 1"
            exit 1
          fi

      # Pinned like everything else this workflow runs on (#80). The check is
      # stdlib-only, so `ubuntu-latest`'s default python3 would work today —
      # which is exactly the argument that stopped being good enough on
      # 2026-08-20. The version a job runs on is not the runner image's to
      # choose.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Deploying is not the same as having deployed, and this is also the
      # freshness monitor. Its comparison — what the server answers vs what is
      # committed — is the only one that can see "200, correct tools, three
      # months old". Kept in a script rather than inline shell so it is unit
      # tested (scripts/tests/test_mcp_freshness.py).
      - name: Verify the MCP server serves the committed data
        run: python3 scripts/check_mcp_freshness.py

  # Surface hard job failures (NDL 403, Anthropic credit exhaustion, a failed
  # MCP deploy, etc.) as a GitHub Issue so they don't sit silently until someone
  # runs `gh run list`. Runs even when the fetch step itself dies, since it's a
  # separate job.
  notify-on-failure:
    name: Notify on failure
    # deploy-mcp too, not just the publish. #85 went unnoticed for three months
    # because a stale MCP server looks like nothing: a red check nobody opens.
    # `failure()` is true if EITHER needed job failed, so the morning that stops
    # deploying the MCP server raises the same issue a failed publish does.
    #
    # The cost, paid knowingly: `needs` waits for BOTH, so a publish failure no
    # longer raises its issue immediately — it waits out deploy-mcp, which is
    # ~19 minutes on the measured normal path and up to its 60-minute timeout.
    # Acceptable because this is a once-a-morning GitHub issue and not a page,
    # and because the alternative — one notify job per needed job — duplicates
    # the create-or-update logic and can file the same morning twice. #90 tracks
    # decoupling the latency without losing either signal.
    needs: [fetch-and-summarize, deploy-mcp]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure-tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          # This job intentionally skips actions/checkout, so gh cannot infer the
          # repo from a local .git. Pin it explicitly or every gh call dies with
          # "fatal: not a git repository".
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE_TAG=$(date -u +%Y-%m-%d)
          # This issue dedups onto one long-lived thread, so the body is the only
          # place a reader gets a hypothesis before opening the log. A systemic
          # summary failure now reds the job too, and it is the one cause here
          # whose data is already committed — say so, or the first reaction is to
          # go looking for lost threads that are not lost.
          # Two jobs can red this now, and they fail for unrelated reasons. Read
          # WHICH job failed first: a Deploy MCP server failure says nothing
          # about the day's threads (they are already pushed), and a publish
          # failure says nothing about the MCP server.
          BODY=$(printf '`Daily Batch` failed on %s.\n\nRun log: %s\n\nCheck which job went red first.\n\n**fetch-and-summarize** (the publish): NDL API 403 (datacenter IP block), Anthropic credit exhaustion, Anthropic batch timeout (summary phase), a fetcher schema change, or a date that produced nothing that reached the site — check the run summary for "Nothing reached the site on", "held for a human decision", or "Permanently lost". That covers a rejected request AND an answer that could not be assembled into a thread, so do not assume a 400; it publishes normally and only alerts. A held or abandoned sidecar can red the run with the Summarize step never running at all — check the Collect step annotations too.\n\n**deploy-mcp** (the MCP server, #85): what the MCP server is serving is unconfirmed — read the job to see whether the deploy failed or the freshness check did, and note the check has four outcomes and only ONE of them is staleness — "could not reach the server at all" and "could not read the committed data either" are the other two reds, and both say nothing about whether the server is old. Causes: the VERCEL_TOKEN secret missing, expired, or not scoped to the team that owns open-gikai-mcp (the CLI reports that last one as "Project not found"); or the deployed server genuinely disagreeing with the committed data. This job runs whether or not the publish above succeeded, so do not read a failure here as saying anything about the day threads either way.' "$DATE_TAG" "$RUN_URL")
          # Ensure the dedup label exists (no-op if already present).
          gh label create pipeline-failure \
            --color B60205 \
            --description "Daily batch pipeline failure" 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label pipeline-failure \
            --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "Daily Batch failed" \
              --label pipeline-failure --body "$BODY"
          fi

  notify-stuck-batch:
    name: Notify on stuck batch
    needs: fetch-and-summarize
    # always(), and the dedup #71 asked for is done by DATE instead (see the
    # --exclude-dates step below). The duplicate was real: a held sidecar reds
    # the run, so notify-on-failure comments about it, and this job commented a
    # SECOND time on the same deduped pipeline-failure issue every morning for
    # the weeks a human decision can take, burying other failures' comments.
    #
    # But `if: success()` would have paid for that with the one signal only this
    # job has — "a batch has been in flight for over two days" does NOT red the
    # run, so muting the job on red mornings reports it ZERO times for as long
    # as anything else is broken. That is the whole window in which it matters:
    # results expire at ~29 days and the abandon gate writes the batch off at
    # 31, so the warning would vanish exactly when a second failure is most
    # likely and reappear only after the loss. "Broken but green" is the cost
    # this pipeline keeps paying (#66); do not trade a warning for quiet.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Comment if any sidecar is older than 2 days
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Through env, not an inline expression, per the LOOKBACK_DAYS rule.
          ALREADY_REPORTED: >-
            ${{ needs.fetch-and-summarize.outputs.held_dates }}
            ${{ needs.fetch-and-summarize.outputs.abandoned_dates }}
        run: |
          STUCK=$(python scripts/check_stuck_batches.py \
                    --exclude-dates "$ALREADY_REPORTED" || true)
          if [ -n "$STUCK" ]; then
            gh label create pipeline-failure --color B60205 \
              --description "Daily batch pipeline failure" 2>/dev/null || true
            EXISTING=$(gh issue list --state open --label pipeline-failure \
              --json number --jq '.[0].number' 2>/dev/null || true)
            BODY=$(printf 'Stuck summary batch(es) detected (in-flight > 2 days):\n\n%s' "$STUCK")
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY"
            else
              gh issue create --title "Stuck summary batch" \
                --label pipeline-failure --body "$BODY"
            fi
          fi

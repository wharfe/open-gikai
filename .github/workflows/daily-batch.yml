name: Daily Batch

on:
  schedule:
    # Run at 6:00 AM JST (21:00 UTC previous day).
    # NDL transcripts are typically published days or weeks after a session,
    # so the batch re-fetches a sliding window each run.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many past days to (re-)fetch. Default: 30"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  fetch-and-summarize:
    name: Fetch & Summarize
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Exported so notify-stuck-batch can skip the dates this run's failure path
    # already commented about (#71) instead of muting itself on every red
    # morning. Empty when the job died before Collect — correct: nothing
    # reported them either, so nothing should be suppressed.
    outputs:
      held_dates: ${{ steps.collect.outputs.held_dates }}
      abandoned_dates: ${{ steps.collect.outputs.abandoned_dates }}
    env:
      # Route untrusted input through env so it never lands in a run: string
      # as a literal expression interpolation.
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '30' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The stalled-pipeline check below counts consecutive zero-thread runs
          # in `git log -n 10`. The default shallow clone (depth 1) leaves at
          # most this run's own commits reachable, so that counter could never
          # pass 1 and its `>= 7` warning has never once fired. Enough depth to
          # see the 40-commit window it scans (data commits are interleaved with
          # chore ones, so 10 data commits need well over 10 of history).
          fetch-depth: 60

      # Must run before ANY step that commits. summarize.py early-commits the
      # pending-batch sidecar mid-poll (its safety net against the job being
      # killed with a batch in flight); with the identity set later, in the
      # commit step, that git commit exited 128 on every date and the net was
      # never actually armed in CI.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Python dependencies
        run: pip install requests anthropic python-dotenv pymupdf beautifulsoup4

      - name: Install Node dependencies
        run: npm ci

      - name: Validate lookback window
        # Defense-in-depth: the input is admin-only and is also routed through
        # env, but we still pin it to a small integer before any shell use.
        run: |
          case "$LOOKBACK_DAYS" in
            ''|*[!0-9]*) echo "Invalid LOOKBACK_DAYS: $LOOKBACK_DAYS"; exit 1 ;;
          esac
          if [ "$LOOKBACK_DAYS" -gt 365 ]; then
            echo "LOOKBACK_DAYS too large: $LOOKBACK_DAYS"; exit 1
          fi

      # ----- Source: NDL Diet Records -----
      - name: Fetch from NDL API (lookback window)
        run: python scripts/fetch_ndl.py --lookback-days "$LOOKBACK_DAYS"

      # ----- Source: Kantei Press Conferences -----
      - name: Fetch from Kantei (lookback window)
        continue-on-error: true
        run: python scripts/fetch_kantei.py --lookback-days "$LOOKBACK_DAYS"

      # ----- Source: Council (審議会) Meeting Minutes -----
      - name: Fetch from Council (lookback window)
        continue-on-error: true
        run: |
          for COUNCIL in kisei nichiiki kankeijinkou suishin chiikiseikatsu chihousousei digital_denen kyojushien; do
            python scripts/fetch_council.py --council "$COUNCIL" --lookback-days "$LOOKBACK_DAYS" || true
          done

      # ----- Determine which dates have raw data -----
      - name: Detect dates with raw data
        id: dates
        run: |
          DATES=$(ls data/raw/ 2>/dev/null \
            | grep -E '^(ndl|kantei|council-[a-z_]+)-[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' \
            | sed -E 's/^(ndl|kantei|council-[a-z_]+)-([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$/\2/' \
            | sort -u | tr '\n' ' ')
          echo "Found raw data for dates: $DATES"
          echo "list=$DATES" >> "$GITHUB_OUTPUT"

      # ----- Resume in-flight batches from prior runs FIRST -----
      # Collects any committed sidecars (data/pending-batches/) within a shared
      # budget. Every sidecar state (RESUBMIT/HOLD/BLOCKED/LOST) exits 0 — see
      # the comment below. Non-zero here means a crash, not a batch outcome.
      - name: Collect pending batches
        id: collect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          # No rc capture on purpose. This process speaks for MANY dates, so it
          # answers with systemic/suspect/held/abandoned_dates outputs (written
          # from Python) and exits 0 for every sidecar state — including the ones
          # that need a human. Since #65 a non-zero code from here means a crash,
          # and must still abort under set -e.
          python scripts/summarize.py --collect-pending --batch-budget 1800 --ci-commit

      # ----- Summarize (auto-resume per date) -----
      # --batch routes the per-thread summary calls through the Message
      # Batches API for a 50% input/output token discount, stackable with
      # the prompt-caching prefix. Grouping and outcome extraction remain
      # synchronous (one small call per meeting; not worth batching).
      - name: Summarize new content with Claude API
        id: summarize
        if: steps.dates.outputs.list != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATES_LIST: ${{ steps.dates.outputs.list }}
        run: |
          set -e
          # Dates that produced no usable summary. Collected rather than raised
          # here: the run must still publish what it has, so the job is failed
          # at the very end instead (see "Fail the run" below).
          #   exit 3 = systemic     — enough evidence on its own
          #   exit 4 = suspect      — one meeting failed on an already-published
          #                           date. Alone that is ordinary breakage; the
          #                           30-day lookback re-visits published dates
          #                           daily, so failing on one would fail most
          #                           mornings. Several in ONE run is different:
          #                           a total outage can present as nothing but
          #                           1-of-1 failures. This loop only collects
          #                           the per-date verdicts; the threshold lives
          #                           in the final step, which is the only place
          #                           that also sees Collect's dates.
          SYSTEMIC=""
          SUSPECT=""
          for d in $DATES_LIST; do
            # Per-date, not per-run. A sidecar means THIS date already has a batch
            # in flight (or held for a human), so re-summarizing it would submit a
            # second one. It says nothing about the other dates — gating all of
            # them on one stuck sidecar is what turned a single uncollectable
            # batch into a two-month outage (#43/#44).
            if [ -f "data/pending-batches/$d.json" ]; then
              echo "Sidecar present for $d — Collect owns this date; skipping"
              continue
            fi
            echo "::group::Summarize $d"
            # `|| rc=$?` keeps `set -e` from aborting the loop on exit 3 and 4,
            # while any OTHER non-zero code still aborts it as before — a crash
            # and an outage need different handling, and swallowing both would
            # put us back where 2026-08-05 started.
            rc=0
            python scripts/summarize.py --date "$d" --batch --batch-budget 1200 --ci-commit || rc=$?
            if [ "$rc" -eq 3 ]; then
              SYSTEMIC="$SYSTEMIC $d"
            elif [ "$rc" -eq 4 ]; then
              SUSPECT="$SUSPECT $d"
            elif [ "$rc" -ne 0 ]; then
              echo "::endgroup::"
              # Say it before dying: a crash on a LATER date must not erase the
              # fact that an earlier one hit a systemic failure. Writing to
              # GITHUB_OUTPUT here would be pointless — every step below has an
              # implicit success() and is skipped once this one fails, so both
              # the run summary and the final diagnostic step never run. An
              # annotation is the one channel that survives a failed step.
              if [ -n "$SYSTEMIC$SUSPECT" ]; then
                echo "::error::Nothing reached the site on:$SYSTEMIC$SUSPECT (before this crash)"
              fi
              exit "$rc"
            fi
            echo "::endgroup::"
            # Once a date leaves a pending sidecar, stop submitting new batches
            # so we never pile up multiple in-flight batches in one run.
            # Distinct from the per-date skip at the top: that one is cross-run
            # (Collect owns the date), this one is within-run (at most one NEW
            # in-flight batch per run).
            if [ -f "data/pending-batches/$d.json" ]; then
              echo "Batch for $d is pending — stopping further submits this run"
              break
            fi
          done
          # The threshold is NOT applied here any more: this step never sees
          # the dates Collect reported (only Collect owns those), so a policy
          # applied here would be blind to half its input. It moved to the
          # last step, which sees both.
          echo "systemic_dates=$SYSTEMIC" >> "$GITHUB_OUTPUT"
          # Always published, failing or not: one suspect date is not worth a red
          # run, but it must still be visible in the run summary. A signal nobody
          # can see is the state this whole change exists to leave behind.
          echo "suspect_dates=$SUSPECT" >> "$GITHUB_OUTPUT"

      # ----- Enrich threads with news articles (Bing News RSS) -----
      # --rank-with-claude filters Bing candidates through a Haiku 4.5 call
      # so we don't attach semantically-similar-but-unrelated articles
      # (e.g. "AI絵画展" for an "AI規制" thread). Best-effort; if the call
      # fails, the script falls back to the top Bing results.
      - name: Enrich threads with news
        if: steps.dates.outputs.list != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATES_LIST: ${{ steps.dates.outputs.list }}
        run: |
          for d in $DATES_LIST; do
            if [ -f "data/threads/$d.json" ]; then
              echo "::group::Enrich $d"
              python scripts/enrich-news.py --date "$d" --rank-with-claude || true
              echo "::endgroup::"
            fi
          done

      # ----- Post-processing -----
      - name: Validate and generate
        run: |
          node scripts/validate-data.mjs --fix
          node scripts/generate-feeds.js
          node scripts/generate-sitemap.mjs

      # ----- Compute "new threads added" metrics for monitoring -----
      - name: Compute new-thread metrics
        id: metrics
        env:
          DATES_LIST: ${{ steps.dates.outputs.list }}
        run: |
          TOTAL_NEW=0
          NEW_DATES=""
          for d in $DATES_LIST; do
            FILE="data/threads/$d.json"
            [ -f "$FILE" ] || continue
            # `|| echo 0` is not cosmetic, and the asymmetry with BEFORE below
            # was the bug: this step runs under `bash -e`, so an assignment
            # whose command substitution fails FAILS THE STEP — and the very
            # next step is the commit. A single corrupt data/threads/*.json
            # therefore skipped the whole morning's publish, which is exactly
            # what summarize.py's exit 3 exists to prevent (#74). Counting it
            # as 0 is also the honest answer: a file we cannot read published
            # no new threads.
            COUNT=$(python3 -c "import json; print(len(json.load(open('$FILE'))))" \
              2>/dev/null || echo 0)
            BEFORE=$(git show HEAD:"$FILE" 2>/dev/null \
              | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null \
              || echo 0)
            DELTA=$((COUNT - BEFORE))
            if [ "$DELTA" -gt 0 ]; then
              TOTAL_NEW=$((TOTAL_NEW + DELTA))
              NEW_DATES="$NEW_DATES $d(+$DELTA)"
            fi
          done
          echo "new_threads=$TOTAL_NEW" >> "$GITHUB_OUTPUT"
          echo "new_dates=$NEW_DATES" >> "$GITHUB_OUTPUT"
          echo "Total new threads this run: $TOTAL_NEW"

      - name: Commit and push data
        id: commit
        env:
          NEW_THREADS: ${{ steps.metrics.outputs.new_threads }}
        run: |
          # Identity is configured once at the top of the job (see above).
          # public/sitemap*.xml covers sitemap.xml, sitemap-*.xml and sitemap_index.xml
          # — all variants emitted by generate-sitemap.mjs.
          mkdir -p data/pending-batches
          git add data/threads/ data/pending-batches/ data/members.json data/status.json \
            public/sitemap.xml public/sitemap-*.xml public/sitemap_index.xml \
            public/feed.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            DATE_TAG=$(date -u +%Y-%m-%d)
            git commit -m "data: daily-batch run ${DATE_TAG} (+${NEW_THREADS} threads)"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
          # Push on "branch is ahead", NOT on "we just committed". summarize.py
          # early-commits the pending-batch sidecar and pushes it itself; when
          # that push loses a race the commit is left local, and gating the push
          # on a staged diff would discard it with the runner — orphaning a
          # batch that is already submitted and paid for, which is the exact
          # outcome the sidecar exists to prevent.
          # origin/<branch> rather than @{u}: actions/checkout's `-B` does not
          # reliably leave an upstream configured. Capture into a variable and
          # fail loudly if the ref cannot be resolved — inlining this in `if`
          # would make the count empty, `[ "" -gt 0 ]` return 2, the condition
          # read as false (conditions are exempt from `bash -e`), and the day's
          # commit die with the runner while the step reported success.
          if ! AHEAD=$(git rev-list --count "origin/${GITHUB_REF_NAME}..HEAD"); then
            echo "::error::cannot resolve origin/${GITHUB_REF_NAME} — refusing to skip the push"
            exit 1
          fi
          if [ "$AHEAD" -gt 0 ]; then
            git push
          else
            echo "Nothing to push"
          fi

      - name: Notify IndexNow
        if: steps.metrics.outputs.new_threads != '0'
        continue-on-error: true
        env:
          DATES_LIST: ${{ steps.dates.outputs.list }}
        run: |
          for d in $DATES_LIST; do
            if [ -f "data/threads/$d.json" ]; then
              node scripts/notify-indexnow.mjs --date "$d" || true
            fi
          done

      # ----- Surface "stalled pipeline" alerts in the workflow summary -----
      # Several consecutive zero-thread runs likely indicate a real pipeline
      # failure (NDL schema change, auth issue), not just a quiet Diet week.
      - name: Detect stalled pipeline
        id: stall
        run: |
          # Only this workflow's data commits count as "runs". summarize.py also
          # commits `chore(pipeline): persist pending batch <date>` mid-poll, and
          # that commit appears precisely when a batch is stuck — i.e. in the
          # regime this check exists to catch. Left in the stream, one such
          # commit breaks the loop on its first iteration and pins STALLED at 0.
          #
          # Filtered with `grep` on `%s`, NOT with `git log --grep`: --grep
          # matches anywhere in the commit message, so a commit merely quoting
          # "data: daily-batch run" in its body would be selected and its
          # unrelated subject printed. `tformat` (not `format`) terminates the
          # last line, which `while read` would otherwise drop — that alone cost
          # this counter one run of every window.
          STALLED=0
          while read -r line; do
            if echo "$line" | grep -q '(+0 threads)'; then
              STALLED=$((STALLED + 1))
            else
              break
            fi
          done < <(git log -n 40 --pretty=tformat:"%s" \
                     | grep '^data: daily-batch run ' | head -n 10)
          echo "consecutive_zero_runs=$STALLED" >> "$GITHUB_OUTPUT"
          if [ "$STALLED" -ge 7 ]; then
            echo "::warning::Pipeline has produced 0 new threads for $STALLED consecutive runs — investigate fetchers"
          fi

      - name: Summary
        env:
          DATES_LIST: ${{ steps.dates.outputs.list }}
          NEW_THREADS: ${{ steps.metrics.outputs.new_threads }}
          NEW_DATES: ${{ steps.metrics.outputs.new_dates }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          STALLED: ${{ steps.stall.outputs.consecutive_zero_runs }}
          SYSTEMIC_DATES: ${{ steps.summarize.outputs.systemic_dates }}
          SUSPECT_DATES: ${{ steps.summarize.outputs.suspect_dates }}
          COLLECT_SYSTEMIC_DATES: ${{ steps.collect.outputs.systemic_dates }}
          COLLECT_SUSPECT_DATES: ${{ steps.collect.outputs.suspect_dates }}
          HELD_DATES: ${{ steps.collect.outputs.held_dates }}
          ABANDONED_DATES: ${{ steps.collect.outputs.abandoned_dates }}
        run: |
          {
            echo "## Daily Batch Summary"
            echo "- **Lookback window**: ${LOOKBACK_DAYS} days"
            echo "- **Dates with raw data**: ${DATES_LIST:-(none)}"
            echo "- **New threads this run**: ${NEW_THREADS}"
            if [ -n "${NEW_DATES}" ]; then
              echo "- **Per-date breakdown**:${NEW_DATES}"
            fi
            echo "- **Committed**: ${COMMITTED}"
            echo "- **Consecutive zero-thread runs**: ${STALLED}"
            # Normalised the same way the final step does: SYSTEMIC_DATES carries
            # a LEADING space per entry (Summarize's `SYSTEMIC="$SYSTEMIC $d"`)
            # and COLLECT_SYSTEMIC_DATES carries none — concatenating the raw
            # strings fuses the last date of one list with the first of the
            # other into a single bogus token. Route both through the same
            # split/dedupe/rejoin so this text can never disagree with the
            # final step's failure text.
            SYSTEMIC_ALL=$(echo "$SYSTEMIC_DATES $COLLECT_SYSTEMIC_DATES" | tr ' ' '\n' \
                             | grep -v '^$' | sort -u | tr '\n' ' ')
            SUSPECT_ALL=$(echo "$SUSPECT_DATES $COLLECT_SUSPECT_DATES" | tr ' ' '\n' \
                            | grep -v '^$' | sort -u | tr '\n' ' ')
            if [ -n "${SYSTEMIC_ALL}" ]; then
              echo "- **Nothing reached the site on**: ${SYSTEMIC_ALL}"
            fi
            if [ -n "${SUSPECT_ALL}" ]; then
              echo "- **One meeting failed on an already-published date**: ${SUSPECT_ALL}"
              echo "  (not a failure on its own — watch for several of these in one run)"
            fi
            HELD_ALL=$(echo "$HELD_DATES" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
            ABANDONED_ALL=$(echo "$ABANDONED_DATES" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
            if [ -n "${HELD_ALL}" ]; then
              echo "- **held for a human decision**: ${HELD_ALL}"
            fi
            if [ -n "${ABANDONED_ALL}" ]; then
              echo "- **Permanently lost**: ${ABANDONED_ALL}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # LAST step on purpose. Everything above has already run: the day's
      # threads are written, committed and pushed, and IndexNow has been
      # notified. Failing here turns an outage into a red run (and, via the
      # notify-on-failure job, a GitHub issue) WITHOUT blocking the publish —
      # the amplification #52 was about. Placing it any earlier would skip the
      # steps below it.
      - name: Fail the run on a systemic summary failure
        env:
          # Through env, not inline expressions, per the same rule as
          # LOOKBACK_DAYS above. Six inputs, not two: Summarize now only skips
          # the specific dates a sidecar already owns, so both it and Collect
          # can have something to say about the same run (#59, #65) — read
          # all four kinds of output from both.
          SUMMARIZE_SYSTEMIC: ${{ steps.summarize.outputs.systemic_dates }}
          SUMMARIZE_SUSPECT: ${{ steps.summarize.outputs.suspect_dates }}
          COLLECT_SYSTEMIC: ${{ steps.collect.outputs.systemic_dates }}
          COLLECT_SUSPECT: ${{ steps.collect.outputs.suspect_dates }}
          COLLECT_HELD: ${{ steps.collect.outputs.held_dates }}
          COLLECT_ABANDONED: ${{ steps.collect.outputs.abandoned_dates }}
        run: |
          # Deduplicate: the threshold below counts DATES, and the same date
          # arriving from both paths must not cross it on its own.
          SYSTEMIC=$(echo "$SUMMARIZE_SYSTEMIC $COLLECT_SYSTEMIC" | tr ' ' '\n' \
                       | grep -v '^$' | sort -u | tr '\n' ' ')
          SUSPECT=$(echo "$SUMMARIZE_SUSPECT $COLLECT_SUSPECT" | tr ' ' '\n' \
                      | grep -v '^$' | sort -u | tr '\n' ' ')
          SUSPECT_N=$(echo "$SUSPECT" | wc -w)

          # THE policy, in one findable place. A suspect date is one meeting
          # failing on an already-published date: the 30-day lookback re-visits
          # published dates every morning, so failing on one would fail most
          # mornings and the alarm would get switched off. Several in ONE run is
          # different — a total outage can present as nothing but 1-of-1
          # failures. Change the threshold HERE, not in Python.
          FAIL_DATES="$SYSTEMIC"
          if [ "$SUSPECT_N" -ge 2 ]; then
            FAIL_DATES="$FAIL_DATES$SUSPECT"
          fi

          # Neither of these is graded. A held sidecar is a request for a
          # decision and an abandoned one is a permanent loss; a threshold that
          # softens either would be answering a question nobody asked. They also
          # get their OWN lines: "Nothing reached the site" is a claim about
          # today's work, and neither of these is that.
          HELD=$(echo "$COLLECT_HELD" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
          ABANDONED=$(echo "$COLLECT_ABANDONED" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')

          if [ -z "$(echo "$FAIL_DATES$HELD$ABANDONED" | tr -d ' ')" ]; then
            echo "No systemic summary failure this run."
            exit 0
          fi

          if [ -n "$(echo "$ABANDONED" | tr -d ' ')" ]; then
            echo "::error::Permanently lost uncollected threads on:${ABANDONED}"
            echo "Those BATCHES can never be assembled: their raw is off disk and the"
            echo "results expired. Nothing recovers those results — this is on the record,"
            echo "not a request for action. Two things it does NOT mean: those dates are"
            echo "not necessarily empty (threads published by earlier runs are unaffected),"
            echo "and the dates themselves can still be re-summarized from scratch by a"
            echo "manual run with a wide enough lookback_days, at the cost of a new batch."
          fi

          if [ -n "$(echo "$HELD" | tr -d ' ')" ]; then
            echo "::error::Pending batches held for a human decision on:${HELD}"
            echo "This aggregates several regimes (hash_mismatch/BLOCKED, retry_exhausted/"
            echo "BLOCKED, and the HOLDs: raw_missing, raw_date_missing, raw_unreadable,"
            echo "threads_file_unreadable, speech_gap) that do NOT all mean the same"
            echo "thing — do not assume any one of them here. The"
            echo "Collect step annotation for EACH date names its actual reason and"
            echo "choices; read that before acting. Publishing continued for every other"
            echo "date; these sidecars stay until someone decides."
          fi

          if [ -n "$(echo "$FAIL_DATES" | tr -d ' ')" ]; then
            echo "::error::Nothing this run produced reached the site on: ${FAIL_DATES}"
            echo "This is an alert, not a publish failure — data already committed above is"
            echo "intact, and these dates may still hold threads from earlier runs."
            echo "The Summarize and Collect step annotations name which of these happened"
            echo "(they are not exclusive — a fully rejected batch reports both):"
            echo "  * 'produced no usable summary' — every meeting asked about this run came"
            echo "    back with nothing usable. That covers an API rejection (400/429/529) but"
            echo "    also an unparsable or empty response and a synchronous exception; check"
            echo "    this run's step log for the per-meeting error to see which it was."
            echo "  * 'sent no summary request at all' — a follow-on line to the one above,"
            echo "    naming meetings that are procedural with a 附帯決議: their only request"
            echo "    is the outcome one, so no thread was ever possible for them and there is"
            echo "    no summary failure to look for. Do not hunt the summary phase for these."
            echo "  * 'assembly failed: <reason>' — the reason names what assembly observed,"
            echo "    not why: hash_mismatch/speech_gap/raw_missing point at raw, missing_result"
            echo "    does not point anywhere on its own — it also fires when every request for"
            echo "    that date was rejected, in which case 'produced no usable summary' fires"
            echo "    alongside it for the same date; read both lines together."
            echo "    hash_mismatch/speech_gap/raw_missing point at raw and are NOT"
            echo "    resubmitted: they appear under 'held for a human decision' above,"
            echo "    with no retry spent. missing_result is retryable and does appear here."
          fi
          exit 1

  # Surface hard job failures (NDL 403, Anthropic credit exhaustion, etc.) as a
  # GitHub Issue so they don't sit silently until someone runs `gh run list`.
  # Runs even when the fetch step itself dies, since it's a separate job.
  notify-on-failure:
    name: Notify on failure
    needs: fetch-and-summarize
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure-tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          # This job intentionally skips actions/checkout, so gh cannot infer the
          # repo from a local .git. Pin it explicitly or every gh call dies with
          # "fatal: not a git repository".
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE_TAG=$(date -u +%Y-%m-%d)
          # This issue dedups onto one long-lived thread, so the body is the only
          # place a reader gets a hypothesis before opening the log. A systemic
          # summary failure now reds the job too, and it is the one cause here
          # whose data is already committed — say so, or the first reaction is to
          # go looking for lost threads that are not lost.
          BODY=$(printf '`Daily Batch` failed on %s.\n\nRun log: %s\n\nCommon causes: NDL API 403 (datacenter IP block), Anthropic credit exhaustion, Anthropic batch timeout (summary phase), a fetcher schema change, or a date that produced nothing that reached the site — check the run summary for "Nothing reached the site on", "held for a human decision", or "Permanently lost". That covers a rejected request AND an answer that could not be assembled into a thread, so do not assume a 400; it publishes normally and only alerts. A held or abandoned sidecar can red the run with the Summarize step never running at all — check the Collect step annotations too.' "$DATE_TAG" "$RUN_URL")
          # Ensure the dedup label exists (no-op if already present).
          gh label create pipeline-failure \
            --color B60205 \
            --description "Daily batch pipeline failure" 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label pipeline-failure \
            --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "Daily Batch failed" \
              --label pipeline-failure --body "$BODY"
          fi

  notify-stuck-batch:
    name: Notify on stuck batch
    needs: fetch-and-summarize
    # always(), and the dedup #71 asked for is done by DATE instead (see the
    # --exclude-dates step below). The duplicate was real: a held sidecar reds
    # the run, so notify-on-failure comments about it, and this job commented a
    # SECOND time on the same deduped pipeline-failure issue every morning for
    # the weeks a human decision can take, burying other failures' comments.
    #
    # But `if: success()` would have paid for that with the one signal only this
    # job has — "a batch has been in flight for over two days" does NOT red the
    # run, so muting the job on red mornings reports it ZERO times for as long
    # as anything else is broken. That is the whole window in which it matters:
    # results expire at ~29 days and the abandon gate writes the batch off at
    # 31, so the warning would vanish exactly when a second failure is most
    # likely and reappear only after the loss. "Broken but green" is the cost
    # this pipeline keeps paying (#66); do not trade a warning for quiet.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Comment if any sidecar is older than 2 days
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Through env, not an inline expression, per the LOOKBACK_DAYS rule.
          ALREADY_REPORTED: >-
            ${{ needs.fetch-and-summarize.outputs.held_dates }}
            ${{ needs.fetch-and-summarize.outputs.abandoned_dates }}
        run: |
          STUCK=$(python scripts/check_stuck_batches.py \
                    --exclude-dates "$ALREADY_REPORTED" || true)
          if [ -n "$STUCK" ]; then
            gh label create pipeline-failure --color B60205 \
              --description "Daily batch pipeline failure" 2>/dev/null || true
            EXISTING=$(gh issue list --state open --label pipeline-failure \
              --json number --jq '.[0].number' 2>/dev/null || true)
            BODY=$(printf 'Stuck summary batch(es) detected (in-flight > 2 days):\n\n%s' "$STUCK")
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY"
            else
              gh issue create --title "Stuck summary batch" \
                --label pipeline-failure --body "$BODY"
            fi
          fi
